<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crypto Hamster Jump</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #020c05;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #072611 0%, #020d06 100%);
      border-radius: 16px;
      border: 2px solid #00ff66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
      display: block;
    }

    #ui-bar {
      position: absolute;
      top: 10px;
      width: calc(100% - 20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 20, 8, 0.85);
      border: 1px solid #00ff66;
      border-radius: 14px;
      padding: 8px 12px;
      z-index: 10;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .ui-col {
      display: flex;
      flex-direction: column;
    }

    .ui-title {
      font-size: 9px;
      color: #7aff9e;
      text-transform: uppercase;
      font-weight: 700;
    }

    .ui-num {
      font-size: 16px;
      font-weight: 800;
      color: #00ff66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }

    .crypto-balances {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      font-size: 13px;
      font-weight: 700;
    }

    .c-badge {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    #buff-indicator {
      position: absolute;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .buff-pill {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #ffcc00;
      color: #ffcc00;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
    }

    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 12, 5, 0.92);
      backdrop-filter: blur(8px);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 16px;
    }

    #game-over h1 {
      font-size: 32px;
      color: #ff3366;
      text-shadow: 0 0 12px #ff3366;
    }

    .result-text {
      text-align: center;
      line-height: 1.6;
      font-size: 15px;
      color: #e0ffe6;
    }

    .restart-btn {
      background: linear-gradient(135deg, #00ff66, #00b344);
      color: #020c05;
      font-weight: 800;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.5);
      transition: transform 0.1s;
    }

    .restart-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div class="ui-col">
        <span class="ui-title">Высота</span>
        <span class="ui-num" id="ui-score">0</span>
      </div>

      <div class="crypto-balances">
        <div class="c-badge" style="color: #38bdf8;">💎 <span id="b-gram">0</span></div>
        <div class="c-badge" style="color: #a78bfa;">💠 <span id="b-eth">0</span></div>
        <div class="c-badge" style="color: #f59e0b;">🪙 <span id="b-btc">0</span></div>
      </div>

      <div class="ui-col" style="text-align: right;">
        <span class="ui-title">Рекорд</span>
        <span class="ui-num" id="ui-best">0</span>
      </div>
    </div>

    <div id="buff-indicator"></div>

    <canvas id="canvas" width="380" height="640"></canvas>

    <div id="game-over">
      <h1>ЛИКВИДАЦИЯ!</h1>
      <div class="result-text">
        Высота: <b id="final-score" style="color: #00ff66;">0</b> м<br>
        Собрано за забег:<br>
        <span style="color: #38bdf8;">💎 GRAM: <b id="run-gram">0</b></span> | 
        <span style="color: #a78bfa;">💠 ETH: <b id="run-eth">0</b></span> | 
        <span style="color: #f59e0b;">🪙 BTC: <b id="run-btc">0</b></span>
      </div>
      <button class="restart-btn" id="btn-restart">🚀 В БОЙ СНОВА</button>
    </div>
  </div>

  <script>
    // 1. Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    function haptic(type = 'light') {
      try {
        if (tg?.HapticFeedback) {
          if (type === 'heavy') tg.HapticFeedback.notificationOccurred('error');
          else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
          else tg.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    // 2. Аудио (Web Audio API) с безопасной инициализацией
    let audioCtx = null;
    function playTone(freq, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx) {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) audioCtx = new AudioClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 3. Canvas и геометрия
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 380;
    const H = 640;
    canvas.width = W;
    canvas.height = H;

    let score = 0;
    let bestScore = parseInt(localStorage.getItem('hamster_best') || '0', 10);
    let totalGram = parseInt(localStorage.getItem('ch_gram') || '0', 10);
    let totalEth = parseInt(localStorage.getItem('ch_eth') || '0', 10);
    let totalBtc = parseInt(localStorage.getItem('ch_btc') || '0', 10);

    let runGram = 0, runEth = 0, runBtc = 0;
    let isGameOver = false;
    let rocketTimer = 0;

    const player = {
      x: W / 2 - 18,
      y: H - 160,
      w: 36,
      h: 36,
      vx: 0,
      vy: -11,
      gravity: 0.38,
      jumpForce: -11.5,
      facing: 1
    };

    let targetX = player.x;
    let platforms = [];
    let items = [];

    function updateUI() {
      document.getElementById('ui-score').textContent = score;
      document.getElementById('ui-best').textContent = bestScore;
      document.getElementById('b-gram').textContent = totalGram;
      document.getElementById('b-eth').textContent = totalEth;
      document.getElementById('b-btc').textContent = totalBtc;
    }

    function createPlatform(y, type = 'normal') {
      const w = 72;
      const x = Math.random() * (W - w - 24) + 12;
      return {
        x,
        y,
        w,
        h: 14,
        type,
        vx: type === 'moving' ? (Math.random() < 0.5 ? 1.5 : -1.5) : 0,
        broken: false
      };
    }

    function spawnItem(p) {
      if (p.type === 'dump') return;
      const r = Math.random();
      if (r < 0.35) {
        let type = 'gram';
        let val = 1;
        if (r < 0.04) {
          type = 'rocket';
        } else if (r < 0.10) {
          type = 'btc';
          val = 25;
        } else if (r < 0.20) {
          type = 'eth';
          val = 5;
        }

        items.push({
          x: p.x + p.w / 2,
          y: p.y - 14,
          r: 9,
          type,
          val,
          platform: p,
          collected: false
        });
      }
    }

    function initGame() {
      score = 0;
      runGram = 0; runEth = 0; runBtc = 0;
      rocketTimer = 0;
      isGameOver = false;

      player.x = W / 2 - 18;
      player.y = H - 160;
      player.vx = 0;
      player.vy = player.jumpForce;
      targetX = player.x;

      platforms = [];
      items = [];

      // Стартовая зеленая свеча
      platforms.push({ x: W / 2 - 40, y: H - 80, w: 80, h: 14, type: 'normal', vx: 0, broken: false });

      let curY = H - 140;
      while (curY > -100) {
        curY -= (58 + Math.random() * 30);
        const roll = Math.random();
        let type = 'normal';
        if (roll < 0.20) type = 'dump';
        else if (roll < 0.45) type = 'moving';

        const p = createPlatform(curY, type);
        platforms.push(p);
        spawnItem(p);
      }

      updateUI();
      document.getElementById('buff-indicator').innerHTML = '';
      document.getElementById('game-over').style.display = 'none';
    }

    // 4. Управление: Тап слева/справа экрана или клавиши
    let moveLeft = false;
    let moveRight = false;

    window.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width / 2) {
        moveLeft = true;
        moveRight = false;
      } else {
        moveRight = true;
        moveLeft = false;
      }
    });

    window.addEventListener('pointerup', () => {
      moveLeft = false;
      moveRight = false;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight = false;
    });

    // 5. Отрисовка хомяка
    function drawHamster(x, y, facing) {
      ctx.save();
      ctx.translate(x + player.w / 2, y + player.h / 2);
      if (facing < 0) ctx.scale(-1, 1);

      // Ушки
      ctx.fillStyle = '#ffb3ba';
      ctx.beginPath();
      ctx.arc(-13, -14, 5, 0, Math.PI * 2);
      ctx.arc(13, -14, 5, 0, Math.PI * 2);
      ctx.fill();

      // Тело
      ctx.fillStyle = '#e8a85c';
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, Math.PI * 2);
      ctx.fill();

      // Животик
      ctx.fillStyle = '#fff4e3';
      ctx.beginPath();
      ctx.ellipse(0, 4, 11, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Очки крипто-трейдера
      ctx.fillStyle = '#05070a';
      ctx.fillRect(-14, -6, 12, 7);
      ctx.fillRect(2, -6, 12, 7);
      ctx.fillRect(-2, -4, 4, 3);
      ctx.fillStyle = '#00f2fe';
      ctx.fillRect(-11, -4, 4, 2);
      ctx.fillRect(5, -4, 4, 2);

      // Носик
      ctx.fillStyle = '#ff6b81';
      ctx.beginPath();
      ctx.arc(0, 3, 2, 0, Math.PI * 2);
      ctx.fill();

      // Пламя бустера
      if (rocketTimer > 0) {
        ctx.fillStyle = '#ff3300';
        ctx.beginPath();
        ctx.arc(0, 22, 6 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(0, 19, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // 6. Отрисовка предметов и монет
    function drawItem(it) {
      if (it.collected) return;
      ctx.save();
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);

      if (it.type === 'rocket') {
        ctx.fillStyle = '#ff3366';
        ctx.fill();
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🚀', it.x, it.y);
      } else if (it.type === 'btc') {
        ctx.fillStyle = '#f59e0b';
        ctx.fill();
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#78350f';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('₿', it.x, it.y + 0.5);
      } else if (it.type === 'eth') {
        ctx.fillStyle = '#818cf8';
        ctx.fill();
        ctx.strokeStyle = '#c7d2fe';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#1e1b4b';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♦', it.x, it.y);
      } else {
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#0c4a6e';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('G', it.x, it.y + 0.5);
      }
      ctx.restore();
    }

    // 7. Игровой цикл
    function update() {
      if (isGameOver) return;

      // Горизонтальное управление
      if (moveLeft) {
        player.vx = -5.8;
        player.facing = -1;
      } else if (moveRight) {
        player.vx = 5.8;
        player.facing = 1;
      } else {
        player.vx *= 0.82;
      }
      player.x += player.vx;

      // Циклический перенос через края экрана
      if (player.x + player.w < 0) player.x = W;
      if (player.x > W) player.x = -player.w;

      // Бустер ракета
      if (rocketTimer > 0) {
        rocketTimer--;
        player.vy = -14;
        if (rocketTimer === 0) {
          document.getElementById('buff-indicator').innerHTML = '';
        }
      } else {
        player.vy += player.gravity;
      }
      player.y += player.vy;

      // Подвижные платформы
      for (let p of platforms) {
        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x <= 8 || p.x + p.w >= W - 8) p.vx *= -1;
        }
      }

      // Прыжки от платформ (только при движении вниз)
      if (player.vy > 0 && rocketTimer === 0) {
        for (let p of platforms) {
          if (
            player.x + player.w * 0.7 > p.x &&
            player.x + player.w * 0.3 < p.x + p.w &&
            player.y + player.h >= p.y &&
            player.y + player.h <= p.y + p.h + player.vy + 2
          ) {
            if (p.type === 'dump') {
              p.broken = true;
              player.vy = player.jumpForce * 0.9;
              playTone(180, 0.15, 'sawtooth');
              haptic('heavy');
            } else {
              player.vy = player.jumpForce;
              playTone(380, 0.08, 'triangle');
              haptic('light');
            }
            break;
          }
        }
      }

      // Удаление треснувших красных платформ
      platforms = platforms.filter(p => !p.broken);

      // Сбор предметов и монет
      const px = player.x + player.w / 2;
      const py = player.y + player.h / 2;

      for (let it of items) {
        if (!it.collected) {
          if (it.platform && it.platform.type === 'moving') {
            it.x = it.platform.x + it.platform.w / 2;
          }
          const dist = Math.hypot(px - it.x, py - it.y);
          if (dist < player.w / 2 + it.r) {
            it.collected = true;
            if (it.type === 'rocket') {
              rocketTimer = 160;
              document.getElementById('buff-indicator').innerHTML = '<div class="buff-pill">🚀 РАКЕТА!</div>';
              playTone(600, 0.25, 'sawtooth');
              haptic('success');
            } else {
              if (it.type === 'gram') { runGram++; totalGram++; }
              else if (it.type === 'eth') { runEth++; totalEth++; }
              else if (it.type === 'btc') { runBtc++; totalBtc++; }

              localStorage.setItem('ch_gram', totalGram);
              localStorage.setItem('ch_eth', totalEth);
              localStorage.setItem('ch_btc', totalBtc);

              playTone(850, 0.06, 'sine');
              haptic('selection');
              updateUI();
            }
          }
        }
      }

      // Скроллинг мира при наборе высоты
      if (player.y < H * 0.42) {
        const delta = H * 0.42 - player.y;
        player.y = H * 0.42;
        score += Math.floor(delta / 2);

        for (let p of platforms) p.y += delta;
        for (let it of items) it.y += delta;

        // Удаление платформ ниже экрана
        platforms = platforms.filter(p => p.y < H + 50);
        items = items.filter(it => it.y < H + 50 && !it.collected);

        // Спавн новых платформ вверху
        const highestPlatformY = Math.min(...platforms.map(p => p.y));
        if (highestPlatformY > 75) {
          const roll = Math.random();
          let type = 'normal';
          if (roll < 0.22) type = 'dump';
          else if (roll < 0.48) type = 'moving';

          const p = createPlatform(highestPlatformY - (58 + Math.random() * 32), type);
          platforms.push(p);
          spawnItem(p);
        }

        updateUI();
      }

      // Падение в бездну
      if (player.y > H + 40) {
        isGameOver = true;
        haptic('heavy');
        playTone(140, 0.35, 'sawtooth');

        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('hamster_best', bestScore);
          document.getElementById('ui-best').textContent = bestScore;
        }

        document.getElementById('final-score').textContent = score;
        document.getElementById('run-gram').textContent = runGram;
        document.getElementById('run-eth').textContent = runEth;
        document.getElementById('run-btc').textContent = runBtc;
        document.getElementById('game-over').style.display = 'flex';
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      // Фон-сетка
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.05)';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Отрисовка платформ
      for (let p of platforms) {
        ctx.save();
        if (p.type === 'dump') {
          ctx.fillStyle = '#ef4444';
          ctx.shadowColor = '#ef4444';
        } else if (p.type === 'moving') {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
        } else {
          ctx.fillStyle = '#22c55e';
          ctx.shadowColor = '#22c55e';
        }
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();
        ctx.restore();
      }

      // Отрисовка предметов
      items.forEach(drawItem);

      // Отрисовка хомяка
      drawHamster(player.x, player.y, player.facing);
    }

    function loop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(loop);
    }

    document.getElementById('btn-restart').onclick = () => {
      initGame();
      requestAnimationFrame(loop);
    };

    // Запуск игры
    initGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
