<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crypto Hamster Jump</title>
  <!-- Подключение Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #020c05;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #072611 0%, #020d06 100%);
      border-radius: 16px;
      border: 2px solid #00ff66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
    }

    /* Верхняя панель со счетом и монетами */
    #ui-bar {
      position: absolute;
      top: 10px;
      width: calc(100% - 20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 20, 8, 0.85);
      border: 1px solid #00ff66;
      border-radius: 14px;
      padding: 8px 12px;
      z-index: 10;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .ui-col {
      display: flex;
      flex-direction: column;
    }

    .ui-title {
      font-size: 9px;
      color: #7aff9e;
      text-transform: uppercase;
      font-weight: 700;
    }

    .ui-num {
      font-size: 16px;
      font-weight: 800;
      color: #00ff66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }

    .crypto-balances {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      font-size: 13px;
      font-weight: 700;
    }

    .c-badge {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Индикатор активных бустеров */
    #buff-indicator {
      position: absolute;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .buff-pill {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #ffcc00;
      color: #ffcc00;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
    }

    /* Экран окончания игры (ликвидация) */
    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 12, 5, 0.92);
      backdrop-filter: blur(8px);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 16px;
    }

    #game-over h1 {
      font-size: 32px;
      color: #ff3366;
      text-shadow: 0 0 12px #ff3366;
    }

    .result-text {
      text-align: center;
      line-height: 1.6;
      font-size: 15px;
      color: #e0ffe6;
    }

    .restart-btn {
      background: linear-gradient(135deg, #00ff66, #00b344);
      color: #020c05;
      font-weight: 800;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.5);
      transition: transform 0.1s;
    }

    .restart-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div class="ui-col">
        <span class="ui-title">Высота</span>
        <span class="ui-num" id="ui-score">0</span>
      </div>

      <!-- Балансы монет -->
      <div class="crypto-balances">
        <div class="c-badge" style="color: #38bdf8;">💎 <span id="b-gram">0</span></div>
        <div class="c-badge" style="color: #a78bfa;">💠 <span id="b-eth">0</span></div>
        <div class="c-badge" style="color: #f59e0b;">🪙 <span id="b-btc">0</span></div>
      </div>

      <div class="ui-col" style="text-align: right;">
        <span class="ui-title">Рекорд</span>
        <span class="ui-num" id="ui-best">0</span>
      </div>
    </div>

    <!-- Индикатор ракеты / магнита -->
    <div id="buff-indicator"></div>

    <canvas id="canvas"></canvas>

    <div id="game-over">
      <h1>ЛИКВИДАЦИЯ!</h1>
      <div class="result-text">
        Высота: <b id="final-score" style="color: #00ff66;">0</b> м<br>
        Собрано за забег:<br>
        <span style="color: #38bdf8;">💎 GRAM: <b id="run-gram">0</b></span> | 
        <span style="color: #a78bfa;">💠 ETH: <b id="run-eth">0</b></span> | 
        <span style="color: #f59e0b;">🪙 BTC: <b id="run-btc">0</b></span>
      </div>
      <button class="restart-btn" id="btn-restart">🚀 В БОЙ СНОВА</button>
    </div>
  </div>

  <script>
    // 1. Инициализация Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'heavy') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
