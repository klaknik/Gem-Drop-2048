<!DOCTYPE html>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #020c05;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #072611 0%, #020d06 100%);
      border-radius: 16px;
      border: 2px solid #00ff66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
    }

    #ui-bar {
      position: absolute;
      top: 10px;
      width: calc(100% - 20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 20, 8, 0.85);
      border: 1px solid #00ff66;
      border-radius: 14px;
      padding: 8px 12px;
      z-index: 10;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .ui-col {
      display: flex;
      flex-direction: column;
    }

    .ui-title {
      font-size: 9px;
      color: #7aff9e;
      text-transform: uppercase;
      font-weight: 700;
    }

    .ui-num {
      font-size: 16px;
      font-weight: 800;
      color: #00ff66;
      text-shadow: 0 0 6px rgba(0, 255, 102, 0.6);
    }

    .crypto-balances {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      font-size: 12px;
      font-weight: 700;
    }

    .c-badge {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    #buff-indicator {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }

    .buff-pill {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #ffcc00;
      color: #ffcc00;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
    }

    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 12, 5, 0.92);
      backdrop-filter: blur(8px);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 16px;
    }

    #game-over h1 {
      font-size: 32px;
      color: #ff3366;
      text-shadow: 0 0 12px #ff3366;
    }

    .result-text {
      text-align: center;
      line-height: 1.6;
      font-size: 15px;
      color: #e0ffe6;
    }

    .restart-btn {
      background: linear-gradient(135deg, #00ff66, #00b344);
      color: #020c05;
      font-weight: 800;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.5);
      transition: transform 0.1s;
    }

    .restart-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div class="ui-col">
        <span class="ui-title">Высота</span>
        <span class="ui-num" id="ui-score">0</span>
      </div>

      <div class="crypto-balances">

        <span style="color: #a78bfa;">💠 ETH: <b id="run-eth">0</b></span> | 
        <span style="color: #f59e0b;">🪙 BTC: <b id="run-btc">0</b></span>
      </div>
      <button class="restart-btn" id="btn-restart">🚀 В БОЙ СНОВА</button>
    </div>

  <script>
    // 1. Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'heavy') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // 2. Аудио (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration = 0.1, type = 'sine') {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 3. Параметры Canvas и геометрия
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 380;
    const HEIGHT = 620;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    // Балансы и хранилище
    let totalGram = parseInt(localStorage.getItem('ch_gram') || '0', 10);
    let totalEth = parseInt(localStorage.getItem('ch_eth') || '0', 10);
    let totalBtc = parseInt(localStorage.getItem('ch_btc') || '0', 10);
    let bestHeight = parseInt(localStorage.getItem('ch_best') || '0', 10);

    let runGram = 0, runEth = 0, runBtc = 0;
    let currentHeight = 0;
    let isGameOver = false;

    function updateUI() {
      document.getElementById('b-gram').textContent = totalGram;
      document.getElementById('b-eth').textContent = totalEth;
      document.getElementById('b-btc').textContent = totalBtc;
      document.getElementById('ui-best').textContent = bestHeight;
      document.getElementById('ui-score').textContent = currentHeight;
    }
    updateUI();

    // 4. Игрок: Хомяк-Трейдер
    const player = {
      x: WIDTH / 2 - 18,
      y: HEIGHT - 140,
      w: 36,
      h: 36,
      vx: 0,
      vy: -11,
      gravity: 0.38,
      jumpPower: -11.5,
      facingRight: true,
      rocketTimer: 0,
      magnetTimer: 0,

      draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        if (!this.facingRight) ctx.scale(-1, 1);

        // Ушки
        ctx.fillStyle = '#ffb3ba';
        ctx.beginPath();
        ctx.arc(-13, -14, 5, 0, Math.PI * 2);
        ctx.arc(13, -14, 5, 0, Math.PI * 2);
        ctx.fill();

        // Тело
        ctx.fillStyle = '#e8a85c';
        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.fill();

        // Животик
        ctx.fillStyle = '#fff4e3';
        ctx.beginPath();
        ctx.ellipse(0, 4, 11, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Черные очки криптотрейдера
        ctx.fillStyle = '#05070a';
        ctx.fillRect(-14, -6, 12, 7);
        ctx.fillRect(2, -6, 12, 7);
        ctx.fillRect(-2, -4, 4, 3);
        ctx.fillStyle = '#00f2fe';
        ctx.fillRect(-11, -4, 4, 2);
        ctx.fillRect(5, -4, 4, 2);

        // Носик
        ctx.fillStyle = '#ff6b81';
        ctx.beginPath();
        ctx.arc(0, 3, 2, 0, Math.PI * 2);
        ctx.fill();

        // Эффект огня ракеты
        if (this.rocketTimer > 0) {
          ctx.fillStyle = '#ff3300';
          ctx.beginPath();
          ctx.arc(0, 22, 6 + Math.random() * 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffcc00';
          ctx.beginPath();
          ctx.arc(0, 19, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    };

    // 5. Игровой мир (Платформы, Монеты, Бустеры)
    let platforms = [];
    let coins = [];
    let boosters = [];
    let highestWorldY = HEIGHT - 140;

    function getGap(h) {
      return Math.min(135, 60 + (h / 3500) * 65);
    }

    function spawnPlatformRow(y) {
      const w = 72;
      const x = Math.random() * (WIDTH - w - 24) + 12;
      const redChance = Math.min(0.40, 0.12 + (currentHeight / 8000) * 0.28);
      const roll = Math.random();

      let type = 'normal';
      let vx = 0;

      if (roll < redChance) {
        type = 'dump'; // Красная трескающаяся свеча
      } else if (roll < redChance + 0.25) {
        type = 'moving'; // Синяя подвижная свеча
        vx = (Math.random() < 0.5 ? 1 : -1) * (1.5 + Math.min(2.0, currentHeight / 4000));
      }

      const p = { x, y, w, h: 14, type, vx, broken: false };
      platforms.push(p);

      // Спавн бустеров и монет
      if (type !== 'dump') {
        const bRoll = Math.random();
        if (bRoll < 0.035) {
          boosters.push({ x: x + w / 2, y: y - 18, type: 'rocket', platform: p });
        } else if (bRoll < 0.08) {
          boosters.push({ x: x + w / 2, y: y - 18, type: 'magnet', platform: p });
        } else if (Math.random() < 0.45) {
          // Трёхуровневая система круглых монет
          const cRoll = Math.random();
          let cType = 'gram';
          let val = 1;
          if (cRoll < 0.08) { cType = 'btc'; val = 25; }
          else if (cRoll < 0.30) { cType = 'eth'; val = 5; }

          coins.push({
            x: x + w / 2,
            y: y - 16,
            r: 9,
            type: cType,
            val: val,
            angle: Math.random() * Math.PI,
            platform: p,
            collected: false
          });
        }
      }
    }

    function initGame() {
      platforms = [];
      coins = [];
      boosters = [];
      runGram = 0; runEth = 0; runBtc = 0;
      currentHeight = 0;
      highestWorldY = HEIGHT - 140;
      isGameOver = false;

      player.x = WIDTH / 2 - 18;
      player.y = HEIGHT - 140;
      player.vx = 0;
      player.vy = player.jumpPower;
      player.rocketTimer = 0;
      player.magnetTimer = 0;

      // Стартовая зеленая свеча под игроком
      platforms.push({ x: WIDTH / 2 - 40, y: HEIGHT - 60, w: 80, h: 14, type: 'normal', vx: 0, broken: false });

      let curY = HEIGHT - 120;
      while (curY > -100) {
        curY -= getGap(0);
        spawnPlatformRow(curY);
      }

      document.getElementById('game-over').style.display = 'none';
      updateUI();
    }

    // 6. Сенсорное и клавиатурное управление
    let leftPressed = false;
    let rightPressed = false;

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false;
    });

    window.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width / 2) {
        leftPressed = true;
        rightPressed = false;
      } else {
        rightPressed = true;
        leftPressed = false;
      }
    });

    window.addEventListener('pointerup', () => {
      leftPressed = false;
      rightPressed = false;
    });

    document.getElementById('btn-restart').onclick = initGame;

    // 7. Обновление физики и логики
    function update() {
      if (isGameOver) return;

      // Горизонтальное движение
      if (leftPressed) {
        player.vx = -6.2;
        player.facingRight = false;
      } else if (rightPressed) {
        player.vx = 6.2;
        player.facingRight = true;
      } else {
        player.vx *= 0.82;
      }
      player.x += player.vx;

      // Бесшовный проход через границы
      if (player.x + player.w < 0) player.x = WIDTH;
      if (player.x > WIDTH) player.x = -player.w;

      // Полет на ракете или обычная гравитация
      if (player.rocketTimer > 0) {
        player.rocketTimer--;
        player.vy = -15;
      } else {
        player.vy += player.gravity;
      }
      player.y += player.vy;

      // Прыжки от платформ (только при падении вниз)
      if (player.vy > 0 && player.rocketTimer <= 0) {
        for (let p of platforms) {
          if (
            player.x + player.w * 0.7 > p.x &&
            player.x + player.w * 0.3 < p.x + p.w &&
            player.y + player.h >= p.y &&
            player.y + player.h <= p.y + p.h + player.vy + 2
          ) {
            if (p.type === 'dump') {
              p.broken = true; // Красная свеча ломается
              player.vy = player.jumpPower * 0.9;
              playTone(160, 0.15, 'sawtooth');
              haptic('heavy');
            } else {
              player.vy = player.jumpPower;
              playTone(360, 0.08, 'triangle');
              haptic('light');
            }

          }
        }

      </div>
    </div>

    <div id="buff-indicator"></div>

    <canvas id="canvas" width="400" height="680"></canvas>

    <div id="game-over">
      <h1>ЛИКВИДАЦИЯ!</h1>
      <div class="result-text">
        Высота: <b id="final-score" style="color: #00ff66;">0</b> м<br>
        Собрано за забег:<br>
        <span style="color: #38bdf8;">💎 GRAM: <b id="run-gram">0</b></span> | 
        <span style="color: #a78bfa;">💠 ETH: <b id="run-eth">0</b></span> | 
        <span style="color: #f59e0b;">🪙 BTC: <b id="run-btc">0</b></span>
      </div>
      <button class="restart-btn" id="btn-restart">🚀 В БОЙ СНОВА</button>
    </div>
  </div>

  <script>
    // 1. Инициализация Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'heavy') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // 2. Аудио (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration = 0.1, type = 'sine') {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 3. Игровые переменные и настройки
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    let score = 0;
    let bestScore = Number(localStorage.getItem('hamster_best') || 0);
    document.getElementById('ui-best').innerText = bestScore;

    let totalCoins = { gram: 0, eth: 0, btc: 0 };
    let runCoins = { gram: 0, eth: 0, btc: 0 };

    let isGameOver = false;
    let rocketTimer = 0;

    const player = {
      x: W / 2 - 20,
      y: H - 150,
      w: 42,
      h: 42,
      vx: 0,
      vy: 0,
      jumpForce: -11.5,
      facing: 1
    };

    const gravity = 0.38;
    let platforms = [];
    let items = [];

    // 4. Генерация мира
    function createPlatform(y, type = 'static') {
      return {
        x: Math.random() * (W - 75),
        y: y,
        w: 75,
        h: 14,
        type: type, // static, moving
        dir: Math.random() > 0.5 ? 1 : -1,
        speed: 1.5 + Math.random() * 1.5
      };
    }

    function initGame() {
      score = 0;
      runCoins = { gram: 0, eth: 0, btc: 0 };
      rocketTimer = 0;
      isGameOver = false;

      player.x = W / 2 - 21;
      player.y = H - 140;
      player.vx = 0;
      player.vy = player.jumpForce;

      platforms = [];
      items = [];

      // Стартовая безопасная платформа под ногами
      platforms.push({ x: W / 2 - 45, y: H - 70, w: 90, h: 14, type: 'static' });

      // Начальный пул платформ
      let curY = H - 140;
      while (curY > 0) {
        curY -= (55 + Math.random() * 35);
        const type = Math.random() < 0.2 ? 'moving' : 'static';
        const p = createPlatform(curY, type);
        platforms.push(p);
        maybeSpawnItem(p);
      }

      updateUI();
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('buff-indicator').innerHTML = '';
    }

    function maybeSpawnItem(p) {
      const rand = Math.random();
      if (rand < 0.3) {
        let type = 'gram';
        if (rand < 0.05) type = 'rocket';
        else if (rand < 0.12) type = 'btc';
        else if (rand < 0.20) type = 'eth';

        items.push({
          x: p.x + p.w / 2 - 10,
          y: p.y - 24,
          w: 20,
          h: 20,
          type: type,
          collected: false
        });
      }
    }

    // 5. Управление
    let targetX = player.x;

    function handlePointer(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      targetX = (clientX - rect.left) * scaleX - player.w / 2;
    }

    window.addEventListener('pointerdown', (e) => { initAudio(); handlePointer(e.clientX); });
    window.addEventListener('pointermove', (e) => { if (e.buttons) handlePointer(e.clientX); });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') targetX = player.x - 35;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') targetX = player.x + 35;
    });

    // 6. Отрисовка персонажа и элементов
    function drawHamster(x, y, facing) {
      ctx.save();
      ctx.translate(x + player.w / 2, y + player.h / 2);
      if (facing < 0) ctx.scale(-1, 1);

      // Тело
      ctx.fillStyle = '#e69c24';
      ctx.beginPath();
      ctx.ellipse(0, 3, 18, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // Животик
      ctx.fillStyle = '#ffdfa9';
      ctx.beginPath();
      ctx.ellipse(2, 6, 12, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ушки
      ctx.fillStyle = '#c77810';
      ctx.beginPath();
      ctx.arc(-11, -12, 6, 0, Math.PI * 2);
      ctx.arc(11, -12, 6, 0, Math.PI * 2);
      ctx.fill();

      // Глаз и блик
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7, -3, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(8, -4, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Щечка
      ctx.fillStyle = '#ff6b8b';
      ctx.beginPath();
      ctx.arc(10, 4, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Ракета за спиной при бусте
      if (rocketTimer > 0) {
        ctx.fillStyle = '#ff3366';
        ctx.fillRect(-18, -2, 6, 16);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(-18, 14, 6, 8 + Math.random() * 6);
      }

      ctx.restore();
    }

    function drawPlatform(p) {
      ctx.save();
      if (p.type === 'moving') {
        ctx.fillStyle = '#00e5ff';
        ctx.shadowColor = '#00e5ff';
      } else {
        ctx.fillStyle = '#00ff66';
        ctx.shadowColor = '#00ff66';
      }
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 6);
      ctx.fill();
      ctx.restore();
    }

    function drawItem(it) {
      ctx.font = '18px sans-serif';
      let icon = '💎';
      if (it.type === 'eth') icon = '💠';
      if (it.type === 'btc') icon = '🪙';
      if (it.type === 'rocket') icon = '🚀';
      ctx.fillText(icon, it.x, it.y + 16);
    }

    // 7. Основной цикл игры
    function loop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(loop);
    }

    function update() {
      // Горизонтальное движение с плавным сглаживанием
      player.x += (targetX - player.x) * 0.2;
      if (targetX > player.x + 2) player.facing = 1;
      else if (targetX < player.x - 2) player.facing = -1;

      // Циклический перенос через экран
      if (player.x < -player.w) player.x = W;
      if (player.x > W) player.x = -player.w;

      // Действие бустера
      if (rocketTimer > 0) {
        rocketTimer--;
        player.vy = -12;
        if (rocketTimer === 0) {
          document.getElementById('buff-indicator').innerHTML = '';
        }
      } else {
        player.vy += gravity;
      }

      player.y += player.vy;

      // Движение платформ
      for (let p of platforms) {
        if (p.type === 'moving') {
          p.x += p.speed * p.dir;
          if (p.x <= 0 || p.x + p.w >= W) p.dir *= -1;
        }
      }

      // Проверка прыжка от платформы (только при падении)
      if (player.vy > 0 && rocketTimer === 0) {
        for (let p of platforms) {
          if (
            player.x + player.w * 0.7 > p.x &&
            player.x + player.w * 0.3 < p.x + p.w &&
            player.y + player.h >= p.y &&
            player.y + player.h <= p.y + p.h + player.vy
          ) {
            player.vy = player.jumpForce;
            playTone(420, 0.08, 'triangle');
            haptic('light');
            break;
          }
        }
      }

      // Сбор предметов
      for (let it of items) {
        if (!it.collected &&
            player.x < it.x + it.w &&
            player.x + player.w > it.x &&
            player.y < it.y + it.h &&
            player.y + player.h > it.y) {
          it.collected = true;
          if (it.type === 'rocket') {
            rocketTimer = 160;
            document.getElementById('buff-indicator').innerHTML = '<div class="buff-pill">🚀 РАКЕТА!</div>';
            playTone(700, 0.3, 'sawtooth');
            haptic('success');
          } else {
            runCoins[it.type]++;
            totalCoins[it.type]++;
            playTone(900, 0.06, 'sine');
            haptic('selection');
            updateUI();
          }
        }
      }

      // Скроллинг мира вверх при подъеме игрока
      if (player.y < H * 0.42) {
        const delta = H * 0.42 - player.y;
        player.y = H * 0.42;
        score += Math.floor(delta / 3);

        for (let p of platforms) p.y += delta;
        for (let it of items) it.y += delta;

        // Удаление вышедших за экран объектов
        platforms = platforms.filter(p => p.y < H);
        items = items.filter(it => it.y < H && !it.collected);

        // Генерация новых платформ вверху
        const highestPlatformY = Math.min(...platforms.map(p => p.y));
        if (highestPlatformY > 80) {
          const type = Math.random() < 0.25 ? 'moving' : 'static';
          const p = createPlatform(highestPlatformY - (55 + Math.random() * 35), type);
          platforms.push(p);
          maybeSpawnItem(p);
        }

        updateUI();
      }

      // Поражение (падение вниз экрана)
      if (player.y > H + 50) {
        gameOver();
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      // Фон-сетка
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.04)';
      ctx.lineWidth = 1;
      for (let y = 0; y < H; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      platforms.forEach(drawPlatform);
      items.forEach(drawItem);
      drawHamster(player.x, player.y, player.facing);
    }

    function updateUI() {
      document.getElementById('ui-score').innerText = score;
      document.getElementById('b-gram').innerText = totalCoins.gram;
      document.getElementById('b-eth').innerText = totalCoins.eth;
      document.getElementById('b-btc').innerText = totalCoins.btc;
    }

    function gameOver() {
      isGameOver = true;
      haptic('heavy');
      playTone(180, 0.35, 'sawtooth');

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('hamster_best', bestScore);
        document.getElementById('ui-best').innerText = bestScore;
      }

      document.getElementById('final-score').innerText = score;
      document.getElementById('run-gram').innerText = runCoins.gram;
      document.getElementById('run-eth').innerText = runCoins.eth;
      document.getElementById('run-btc').innerText = runCoins.btc;
      document.getElementById('game-over').style.display = 'flex';
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      initGame();
      requestAnimationFrame(loop);
    });

    // Старт игры при загрузке
    initGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
