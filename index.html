<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GemDrop 2048</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0b0e14;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Верхняя панель */
    header {
      width: 100%;
      max-width: 440px;
      padding: 12px 16px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px 4px 6px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #2aabee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .stats {
      display: flex;
      gap: 12px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: #8e9bb0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: #00f2fe;
    }

    /* Шкала FEVER */
    .fever-wrap {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .fever-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff0844, #ffb199);
      transition: width 0.15s ease-out;
      box-shadow: 0 0 10px #ff0844;
    }

    .fever-active .fever-bar {
      background: linear-gradient(90deg, #f9d423, #ff4e50);
      box-shadow: 0 0 15px #f9d423;
    }

    /* Игровая зона */
    #game-container {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: radial-gradient(circle at center, #151b26 0%, #0d1118 100%);
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    /* Нижняя панель с бонусами */
    footer {
      width: 100%;
      max-width: 440px;
      padding: 10px 16px 16px;
      display: flex;
      justify-content: space-around;
      gap: 12px;
      z-index: 10;
    }

    .boost-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px 6px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .boost-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.15);
    }

    .boost-icon {
      font-size: 18px;
    }

    /* Окно Game Over */
    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 14, 20, 0.88);
      backdrop-filter: blur(8px);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #game-over h2 {
      font-size: 28px;
      color: #ff3366;
    }

    .restart-btn {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0b0e14;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="top-row">
      <div class="user-badge">
        <div class="avatar" id="u-avatar">TG</div>
        <span id="u-name">Игрок</span>
      </div>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Счет</div>
          <div class="stat-val" id="score">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Рекорд</div>
          <div class="stat-val" id="best">0</div>
        </div>
      </div>
    </div>
    <div class="fever-wrap" id="fever-container">
      <div class="fever-bar" id="fever-bar"></div>
    </div>
  </header>

  <div id="game-container">
    <canvas id="canvas"></canvas>
    
    <div id="game-over">
      <h2>Банка заполнена!</h2>
      <p style="color: #8e9bb0;">Ваш результат: <b id="final-score" style="color: #fff;">0</b></p>
      <button class="restart-btn" id="restart-btn">Играть снова</button>
    </div>
  </div>

  <footer>
    <button class="boost-btn" id="btn-shake">
      <span class="boost-icon">🫨</span>
      <span>Встряска</span>
    </button>
    <button class="boost-btn" id="btn-bomb">
      <span class="boost-icon">💣</span>
      <span>Бомба</span>
    </button>
  </footer>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        const u = tg.initDataUnsafe.user;
        document.getElementById('u-name').textContent = u.first_name || 'Игрок';
        document.getElementById('u-avatar').textContent = (u.first_name || 'T')[0].toUpperCase();
      }
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // Процедурный синтезатор звуков (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(freq, type = 'sine', duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Настройки сфер / кристаллов 2048
    const TIERS = [
      { val: 2,    r: 16, color: '#4facfe', label: '2' },
      { val: 4,    r: 20, color: '#00f2fe', label: '4' },
      { val: 8,    r: 25, color: '#43e97b', label: '8' },
      { val: 16,   r: 30, color: '#fa709a', label: '16' },
      { val: 32,   r: 36, color: '#fee140', label: '32' },
      { val: 64,   r: 42, color: '#f83600', label: '64' },
      { val: 128,  r: 49, color: '#b224ef', label: '128' },
      { val: 256,  r: 56, color: '#f9d423', label: '256' },
      { val: 512,  r: 64, color: '#ff0844', label: '512' },
      { val: 1024, r: 72, color: '#e0c3fc', label: '1024' },
      { val: 2048, r: 80, color: '#ffd700', label: '2048' },
    ];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 340;
    const HEIGHT = 460;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    let spheres = [];
    let particles = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('gemdrop_best') || '0', 10);
    document.getElementById('best').textContent = bestScore;

    let feverMeter = 0;
    let isFever = false;
    let feverTimer = 0;

    let currentTier = 0;
    let aimX = WIDTH / 2;
    let canDrop = true;
    let isGameOver = false;

    function getNextTier() {
      // Спавнятся сферы начальных уровней (2, 4 или 8)
      const r = Math.random();
      return r < 0.6 ? 0 : (r < 0.9 ? 1 : 2);
    }
    currentTier = getNextTier();

    // Класс сферы
    class Sphere {
      constructor(x, y, tier) {
        this.x = x;
        this.y = y;
        this.tier = tier;
        this.r = TIERS[tier].r;
        this.vx = 0;
        this.vy = 0;
        this.toRemove = false;
      }

      update() {
        this.vy += 0.35; // Гравитация
        this.vx *= 0.98; // Трение
        this.vy *= 0.98;

        this.x += this.vx;
        this.y += this.vy;

        // Коллизия со стенами банки
        if (this.x - this.r < 0) {
          this.x = this.r;
          this.vx *= -0.4;
        } else if (this.x + this.r > WIDTH) {
          this.x = WIDTH - this.r;
          this.vx *= -0.4;
        }

        // Дно банки
        if (this.y + this.r > HEIGHT) {
          this.y = HEIGHT - this.r;
          this.vy *= -0.3;
          this.vx *= 0.8;
        }
      }

      draw() {
        const item = TIERS[this.tier];
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = item.color;
        ctx.shadowColor = item.color;
        ctx.shadowBlur = isFever ? 18 : 8;
        ctx.fill();

        // Блик
        ctx.beginPath();
        ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.shadowBlur = 0;
        ctx.fill();

        // Числовое значение
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(10, Math.floor(this.r * 0.65))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.fillText(item.label, this.x, this.y);
        ctx.restore();
      }
    }

    // Частицы при слиянии
    function spawnParticles(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color
        });
      }
    }

    // Проверка физических столкновений
    function handlePhysics() {
      for (let i = 0; i < spheres.length; i++) {
        for (let j = i + 1; j < spheres.length; j++) {
          const a = spheres[i];
          const b = spheres[j];
          if (a.toRemove || b.toRemove) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.r + b.r;

          if (dist < minDist) {
            // Одинаковые сферы -> Слияние 2048!
            if (a.tier === b.tier && a.tier < TIERS.length - 1) {
              a.toRemove = true;
              b.toRemove = true;

              const nextTier = a.tier + 1;
              const midX = (a.x + b.x) / 2;
              const midY = (a.y + b.y) / 2;
              
              const merged = new Sphere(midX, midY, nextTier);
              merged.vy = -1.5;
              spheres.push(merged);

              const gained = TIERS[nextTier].val;
              addScore(gained);
              spawnParticles(midX, midY, TIERS[nextTier].color);
              
              playSound(220 + nextTier * 50, 'sine', 0.15);
              haptic('medium');

              // Накопление Fever
              addFever(8);
              return;
            }

            // Отталкивание при столкновении
            const overlap = minDist - dist;
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);

            a.x -= nx * overlap * 0.5;
            a.y -= ny * overlap * 0.5;
            b.x += nx * overlap * 0.5;
            b.y += ny * overlap * 0.5;

            const kx = a.vx - b.vx;
            const ky = a.vy - b.vy;
            const p = 2 * (nx * kx + ny * ky) / 2;

            a.vx -= p * nx * 0.4;
            a.vy -= p * ny * 0.4;
            b.vx += p * nx * 0.4;
            b.vy += p * ny * 0.4;
          }
        }
      }
      spheres = spheres.filter(s => !s.toRemove);
    }

    function addScore(val) {
      score += isFever ? val * 2 : val;
      document.getElementById('score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        document.getElementById('best').textContent = bestScore;
        localStorage.setItem('gemdrop_best', bestScore);
      }
    }

    function addFever(amount) {
      if (isFever) return;
      feverMeter = Math.min(100, feverMeter + amount);
      document.getElementById('fever-bar').style.width = feverMeter + '%';

      if (feverMeter >= 100) {
        isFever = true;
        document.getElementById('fever-container').classList.add('fever-active');
        haptic('success');
        playSound(600, 'triangle', 0.4);
        feverTimer = 400; // ~6-7 секунд
      }
    }

    // Сброс шарика
    function dropSphere() {
      if (!canDrop || isGameOver) return;
      canDrop = false;

      const sp = new Sphere(aimX, 30, currentTier);
      spheres.push(sp);
      playSound(340, 'sine', 0.08);
      haptic('light');

      currentTier = getNextTier();

      setTimeout(() => {
        canDrop = true;
      }, isFever ? 200 : 450);
    }

    // Управление пальцем / мышью
    function setAim(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      let x = (clientX - rect.left) * scaleX;
      const r = TIERS[currentTier].r;
      aimX = Math.max(r, Math.min(WIDTH - r, x));
    }

    canvas.addEventListener('pointerdown', (e) => {
      setAim(e.clientX);
    });

    canvas.addEventListener('pointermove', (e) => {
      setAim(e.clientX);
    });

    canvas.addEventListener('pointerup', () => {
      dropSphere();
    });

    // Бонус: Встряска
    document.getElementById('btn-shake').onclick = () => {
      if (isGameOver) return;
      spheres.forEach(s => {
        s.vy -= Math.random() * 6 + 3;
        s.vx += (Math.random() - 0.5) * 6;
      });
      playSound(150, 'sawtooth', 0.2);
      haptic('heavy');
    };

    // Бонус: Бомба
    document.getElementById('btn-bomb').onclick = () => {
      if (isGameOver || spheres.length === 0) return;
      // Удаляем 3 нижних шарика
      spheres.sort((a, b) => b.y - a.y);
      const removed = spheres.splice(0, 3);
      removed.forEach(r => spawnParticles(r.x, r.y, '#ff0844'));
      playSound(90, 'square', 0.3);
      haptic('heavy');
    };

    // Перезапуск игры
    document.getElementById('restart-btn').onclick = () => {
      spheres = [];
      particles = [];
      score = 0;
      feverMeter = 0;
      isFever = false;
      isGameOver = false;
      document.getElementById('score').textContent = '0';
      document.getElementById('fever-bar').style.width = '0%';
      document.getElementById('game-over').style.display = 'none';
      canDrop = true;
    };

    // Главный игровой цикл
    function loop() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Линия переполнения
      ctx.strokeStyle = 'rgba(255, 51, 102, 0.35)';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, 75);
      ctx.lineTo(WIDTH, 75);
      ctx.stroke();
      ctx.setLineDash([]);

      // Прицел и шарик в руках
      if (canDrop && !isGameOver) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.beginPath();
        ctx.moveTo(aimX, 30);
        ctx.lineTo(aimX, HEIGHT);
        ctx.stroke();

        const cur = TIERS[currentTier];
        ctx.save();
        ctx.beginPath();
        ctx.arc(aimX, 30, cur.r, 0, Math.PI * 2);
        ctx.fillStyle = cur.color;
        ctx.shadowColor = cur.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      // Физика и отрисовка сфер
      handlePhysics();
      spheres.forEach(s => {
        s.update();
        s.draw();
      });

      // Частицы
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
      particles = particles.filter(p => p.life > 0);

      // Логика Fever
      if (isFever) {
        feverTimer--;
        document.getElementById('fever-bar').style.width = (feverTimer / 400 * 100) + '%';
        if (feverTimer <= 0) {
          isFever = false;
          feverMeter = 0;
          document.getElementById('fever-container').classList.remove('fever-active');
        }
      }

      // Проверка проигрыша (сфера зависла выше линии 75px)
      if (!isGameOver) {
        const overflow = spheres.some(s => s.y - s.r < 75 && Math.abs(s.vy) < 0.2);
        if (overflow) {
          isGameOver = true;
          document.getElementById('final-score').textContent = score;
          document.getElementById('game-over').style.display = 'flex';
          haptic('heavy');
        }
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
