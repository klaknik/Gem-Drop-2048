      ### Новые механики сложности

Чтобы игра держала игрока в напряжении и мотивировала прокачиваться, можно внедрить следующие усложнения:

*   **Динамическая скорость и лимит времени:** Постепенное ускорение спавна препятствий или таймер на уровень («выживи 60 секунд»), который заставляет игрока действовать агрессивнее.
*   **Случайные дебаффы (модификаторы волн):** Временный туман на экране, зоны с инверсией управления или «шторм», сносящий персонажа в сторону.
*   **Коварные типы препятствий/врагов:** Враги, требующие нескольких попаданий, ловушки-хамелеоны (сливающиеся с фоном) или преследующие снаряды.
*   **Режим «Хардкор / Одна жизнь»:** Отдельный режим без чекпоинтов с повышенным шансом выпадения редкого лута за прохождение.

---

### Бустеры и расходники

Временные усиления, которые помогают преодолевать возросшую сложность:

*   **Магнит криптовалюты:** Притягивает все монеты на экране в течение 8–10 секунд.
*   **Крипто-щит:** Поглощает одно столкновение или урон от ловушки.
*   **Заморозка времени (HODL):** Замедляет окружение и препятствия на 50%, оставляя скорость игрока прежней.
*   **Двойной майнинг:** Удваивает ценность всех собранных монет на ограниченный период.

---

### Экономика коллекционных монет

Все монеты выполнены в едином дизайне — классические круглые жетоны с рельефной окантовкой и светящимся градиентом:

| Монета | Внешний вид | Редкость и ценность | Назначение |
| :--- | :--- | :--- | :--- |
| **Круглый Ethereum (ETH)** | Серебристо-фиолетовый круг с граненым ромбом в центре | Средняя редкость (дроп 10–15%) | Базовые бустеры, простые цветовые скины, расходники |
| **Круглый Bitcoin (BTC)** | Золотистый круг с классической буквой «₿» и радиальным блеском | Высокая редкость (дроп 1–3%) | Легендарные скины, уникальные эффекты следа (трейлы), постоянные перки |

---

### Магазин обмена

*   **Конвертация валют:** Возможность обменять фиксированное число круглых ETH на BTC (например, 100 ETH = 1 BTC) для баланса гринда.
*   **Витрина скинов:** Косметические оболочки для персонажа (киберпанк-стиль, неоновые контуры, костюмы трейдеров), которые не влияют на баланс, но показывают статус игрока.
