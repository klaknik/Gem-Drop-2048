<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crypto Jump: Gram Collector</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #041207;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Верхняя панель со счетом и криптой GRAM */
    #ui-bar {
      position: absolute;
      top: 10px;
      width: calc(100% - 20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(4, 25, 10, 0.85);
      border: 1px solid #00ff66;
      border-radius: 16px;
      padding: 8px 14px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.25);
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .ui-item {
      display: flex;
      flex-direction: column;
    }

    .ui-label {
      font-size: 9px;
      color: #7aff9e;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .ui-val {
      font-size: 16px;
      font-weight: 800;
      color: #00ff66;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
    }

    .gram-box {
      align-items: center;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid #00f2fe;
      padding: 4px 10px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .gram-val {
      color: #00f2fe;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.7);
    }

    canvas {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #07220e 0%, #020f06 100%);
      border-radius: 18px;
      border: 2px solid #00ff66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25);
    }

    /* Экран Game Over */
    #overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 12, 5, 0.92);
      backdrop-filter: blur(8px);
      z-index: 20;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 18px;
    }

    #overlay h1 {
      font-size: 30px;
      color: #ff3366;
      text-shadow: 0 0 12px #ff3366;
      text-align: center;
    }

    .stat-result {
      font-size: 16px;
      color: #e0ffe6;
      text-align: center;
      line-height: 1.6;
    }

    .btn-action {
      background: linear-gradient(135deg, #00ff66, #00b344);
      color: #031407;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
      transition: transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="ui-bar">
      <div class="ui-item">
        <span class="ui-label">Высота</span>
        <span class="ui-val" id="score">0</span>
      </div>

      <!-- Баланс криптовалюты GRAM -->
      <div class="ui-item gram-box">
        <span class="ui-label" style="color: #80f9ff;">GRAM Баланс</span>
        <span class="ui-val gram-val">💎 <span id="gram-count">0</span></span>
      </div>

      <div class="ui-item" style="text-align: right;">
        <span class="ui-label">Рекорд</span>
        <span class="ui-val" id="best">0</span>
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="overlay">
      <h1>ЛИКВИДАЦИЯ!</h1>
      <div class="stat-result">
        Высота: <b id="final-score" style="color: #00ff66;">0</b> м<br>
        Собрано за забег: <b id="final-gram" style="color: #00f2fe;">0</b> GRAM 💎
      </div>
      <button class="btn-action" id="restart-btn">🚀 НА ЛУНУ СНОВА</button>
    </div>
  </div>

  <script>
    // Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'heavy') tg.HapticFeedback.notificationOccurred('error');
        else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // Аудиосинтезатор Web Audio API
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playJumpSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(680, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    // Звук сбора криптовалюты GRAM
    function playCoinSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(980, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 380;
    const HEIGHT = 620;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    let score = 0;
    let runGrams = 0;
    let totalGrams = parseInt(localStorage.getItem('crypto_gram_total') || '0', 10);
    let bestScore = parseInt(localStorage.getItem('crypto_jump_best') || '0', 10);
    
    document.getElementById('best').textContent = bestScore;
    document.getElementById('gram-count').textContent = totalGrams;

    let isGameOver = false;

    // Персонаж: Базовый скин — Крипто-Хомяк
    const player = {
      x: WIDTH / 2 - 20,
      y: HEIGHT - 150,
      w: 40,
      h: 40,
      vx: 0,
      vy: -9,
      gravity: 0.38,
      jumpPower: -11.5,
      facingRight: true,
      skin: 'hamster', // 'hamster' (базовый) или 'pepe' (для будущего магазина скинов)
      draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        if (!this.facingRight) ctx.scale(-1, 1);

        if (this.skin === 'hamster') {
          // Ушки хомяка
          ctx.fillStyle = '#ffb3ba';
          ctx.beginPath();
          ctx.arc(-14, -15, 6, 0, Math.PI * 2);
          ctx.arc(14, -15, 6, 0, Math.PI * 2);
          ctx.fill();

          // Тело хомяка (золотисто-песочное)
          ctx.fillStyle = '#e8a85c';
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.fill();

          // Пузико/мордочка
          ctx.fillStyle = '#fff4e3';
          ctx.beginPath();
          ctx.ellipse(0, 5, 12, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          // Очки крипто-трейдера (стильные черные пиксельные очки)
          ctx.fillStyle = '#05070a';
          ctx.fillRect(-15, -7, 13, 8);
          ctx.fillRect(2, -7, 13, 8);
          ctx.fillRect(-2, -5, 4, 3);
          
          // Белые блики на очках
          ctx.fillStyle = '#00f2fe';
          ctx.fillRect(-12, -5, 4, 3);
          ctx.fillRect(5, -5, 4, 3);

          // Носик хомяка
          ctx.fillStyle = '#ff6b81';
          ctx.beginPath();
          ctx.arc(0, 3, 2.5, 0, Math.PI * 2);
          ctx.fill();

          // Ручки хомяка с маленьким крипто-графиком
          ctx.fillStyle = '#e8a85c';
          ctx.beginPath();
          ctx.arc(-12, 10, 4, 0, Math.PI * 2);
          ctx.arc(12, 10, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    };

    // Платформы и монеты GRAM
    let platforms = [];
    let coins = [];
    const PLATFORM_COUNT = 8;

    function initGameObjects() {
      platforms = [];
      coins = [];
      
      // Стартовая безопасная платформа
      platforms.push({ x: WIDTH / 2 - 40, y: HEIGHT - 60, w: 80, h: 14, type: 'basic' });

      for (let i = 1; i < PLATFORM_COUNT; i++) {
        spawnPlatform(HEIGHT - (i * (HEIGHT / PLATFORM_COUNT)));
      }
    }

    function spawnPlatform(y) {
      const w = 72;
      const x = Math.random() * (WIDTH - w - 20) + 10;
      const isMoving = Math.random() < 0.25;
      const platform = {
        x,
        y,
        w,
        h: 14,
        type: isMoving ? 'moving' : 'basic',
        vx: isMoving ? (Math.random() < 0.5 ? 1.6 : -1.6) : 0
      };
      platforms.push(platform);

      // С вероятностью 45% на платформе появляется криптовалюта GRAM
      if (Math.random() < 0.45) {
        coins.push({
          x: platform.x + platform.w / 2,
          y: platform.y - 18,
          r: 10,
          platform: platform,
          collected: false,
          angle: Math.random() * Math.PI
        });
      }
    }

    // Управление
    let leftPressed = false;
    let rightPressed = false;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
      if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
      if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
    });

    // Сенсорные нажатия для смартфонов
    window.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width / 2) {
        leftPressed = true;
        rightPressed = false;
      } else {
        rightPressed = true;
        leftPressed = false;
      }
    });

    window.addEventListener('pointerup', () => {
      leftPressed = false;
      rightPressed = false;
    });

    function resetGame() {
      player.x = WIDTH / 2 - 20;
      player.y = HEIGHT - 150;
      player.vx = 0;
      player.vy = player.jumpPower;
      score = 0;
      runGrams = 0;
      document.getElementById('score').textContent = '0';
      isGameOver = false;
      document.getElementById('overlay').style.display = 'none';
      initGameObjects();
    }

    document.getElementById('restart-btn').onclick = resetGame;

    // Главный цикл обновлений
    function update() {
      if (isGameOver) return;

      // Горизонтальное ускорение
      if (leftPressed) {
        player.vx = -6.2;
        player.facingRight = false;
      } else if (rightPressed) {
        player.vx = 6.2;
        player.facingRight = true;
      } else {
        player.vx *= 0.82;
      }

      player.x += player.vx;

      // Бесшовный телепорт через края экрана
      if (player.x + player.w < 0) player.x = WIDTH;
      if (player.x > WIDTH) player.x = -player.w;

      // Гравитация
      player.vy += player.gravity;
      player.y += player.vy;

      // Прыжок при приземлении на платформу
      if (player.vy > 0) {
        for (let p of platforms) {
          if (
            player.x + player.w * 0.7 > p.x &&
            player.x + player.w * 0.3 < p.x + p.w &&
            player.y + player.h >= p.y &&
            player.y + player.h <= p.y + p.h + 8
          ) {
            player.vy = player.jumpPower;
            playJumpSound();
            haptic('light');
            break;
          }
        }
      }

      // Движение движущихся платформ
      for (let p of platforms) {
        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x <= 5 || p.x + p.w >= WIDTH - 5) p.vx *= -1;
        }
      }

      // Проверка сбора монеток GRAM хомяком
      for (let c of coins) {
        if (!c.collected) {
          // Если монетка привязана к движущейся платформе, двигаем ее следом
          if (c.platform.type === 'moving') {
            c.x = c.platform.x + c.platform.w / 2;
          }
          
          const dx = (player.x + player.w / 2) - c.x;
          const dy = (player.y + player.h / 2) - c.y;
          const dist = Math.hypot(dx, dy);

          if (dist < player.w / 2 + c.r) {
            c.collected = true;
            runGrams++;
            totalGrams++;
            document.getElementById('gram-count').textContent = totalGrams;
            localStorage.setItem('crypto_gram_total', totalGrams);
            playCoinSound();
            haptic('success');
          }
        }
      }

      // Скроллинг камеры вверх
      if (player.y < HEIGHT / 2) {
        const delta = (HEIGHT / 2) - player.y;
        player.y = HEIGHT / 2;
        score += Math.floor(delta);
        document.getElementById('score').textContent = score;

        if (score > bestScore) {
          bestScore = score;
          document.getElementById('best').textContent = bestScore;
          localStorage.setItem('crypto_jump_best', bestScore);
        }

        // Сдвиг платформ и монет вниз
        for (let p of platforms) p.y += delta;
        for (let c of coins) c.y += delta;

        // Удаление ушедших платформ и монет
        platforms = platforms.filter(p => p.y < HEIGHT);
        coins = coins.filter(c => c.y < HEIGHT && !c.collected);

        while (platforms.length < PLATFORM_COUNT) {
          const highestY = Math.min(...platforms.map(p => p.y));
          spawnPlatform(highestY - (HEIGHT / PLATFORM_COUNT) + Math.random() * 8);
        }
      }

      // Падение вниз (Ликвидация)
      if (player.y > HEIGHT) {
        isGameOver = true;
        haptic('heavy');
        document.getElementById('final-score').textContent = score;
        document.getElementById('final-gram').textContent = runGrams;
        document.getElementById('overlay').style.display = 'flex';
      }
    }

    // Отрисовка криптовалюты GRAM (Алмазный синий стиль Gram)
    function drawGramCoin(x, y, r, angle) {
      ctx.save();
      ctx.translate(x, y);

      // Неоновое свечение монеты
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 12;

      // Монета (ромб/кристалл Gram)
      ctx.fillStyle = '#00f2fe';
      ctx.beginPath();
      ctx.moveTo(0, -r - 2);
      ctx.lineTo(r, 0);
      ctx.lineTo(0, r + 2);
      ctx.lineTo(-r, 0);
      ctx.closePath();
      ctx.fill();

      // Внутренние грани кристалла Gram
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, -r - 2);
      ctx.lineTo(0, r + 2);
      ctx.moveTo(-r, 0);
      ctx.lineTo(r, 0);
      ctx.stroke();

      // Буква G по центру
      ctx.fillStyle = '#031407';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('G', 0, 0);

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Кибернетическая фоновая сетка
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.07)';
      ctx.lineWidth = 1;
      for (let x = 0; x < WIDTH; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
      }

      // Отрисовка платформ (зеленые крипто-свечи)
      for (let p of platforms) {
        ctx.save();
        ctx.fillStyle = p.type === 'moving' ? '#00e5ff' : '#00ff66';
        ctx.shadowColor = p.type === 'moving' ? '#00e5ff' : '#00ff66';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();

        // Верхняя часть свечи
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.roundRect(p.x + 3, p.y + 2, p.w - 6, 3, 2);
        ctx.fill();
        ctx.restore();
      }

      // Отрисовка парящих монет GRAM
      for (let c of coins) {
        if (!c.collected) {
          c.angle += 0.04;
          const floatOffset = Math.sin(c.angle) * 3;
          drawGramCoin(c.x, c.y + floatOffset, c.r, c.angle);
        }
      }

      // Отрисовка персонажа
      player.draw();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    initGameObjects();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
