### 1. Логика профиля и трекинга (`stats.js`)

Этот модуль отслеживает дату первого входа, суммирует время в активной вкладке и сохраняет рекорд.

```javascript
const StatsManager = {
  data: {
    firstPlayed: null,
    highScore: 0,
    totalSecondsPlayed: 0
  },

  init() {
    const saved = localStorage.getItem('player_stats');
    if (saved) {
      this.data = JSON.parse(saved);
    } else {
      this.data.firstPlayed = new Date().toLocaleDateString();
      this.save();
    }
    this.startTimeTracker();
  },

  save() {
    localStorage.setItem('player_stats', JSON.stringify(this.data));
  },

  // Запуск таймера: учитывает время только когда вкладка активна
  startTimeTracker() {
    setInterval(() => {
      if (document.visibilityState === 'visible') {
        this.data.totalSecondsPlayed += 1;
        // Сохраняем каждые 10 секунд, чтобы не перегружать хранилище
        if (this.data.totalSecondsPlayed % 10 === 0) {
          this.save();
        }
      }
    }, 1000);

    // Сохранение при выходе со страницы
    window.addEventListener('beforeunload', () => this.save());
  },

  updateScore(score) {
    if (score > this.data.highScore) {
      this.data.highScore = score;
      this.save();
    }
  },

  formatTime(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    return `${hrs > 0 ? hrs + ' ч ' : ''}${mins} мин ${secs} сек`;
  },

  renderProfile() {
    document.getElementById('first-played').textContent = this.data.firstPlayed;
    document.getElementById('high-score').textContent = this.data.highScore;
    document.getElementById('time-played').textContent = this.formatTime(this.data.totalSecondsPlayed);
  }
};

StatsManager.init();
